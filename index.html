  /* ------------------------------------------------- import / export */
  function mergeBrands(list) {
    var added = 0;
    var keys = {};
    App.brands.forEach(function (b) {
      var k = b.handle || L.normalizeIg(b.igUrl) || ("n:" + String(b.name).toLowerCase().trim());
      if (k) keys[k] = true;
    });
    list.forEach(function (nb) {
      var k = nb.handle || L.normalizeIg(nb.igUrl) || ("n:" + String(nb.name).toLowerCase().trim());
      if (k && keys[k]) return;
      if (k) keys[k] = true;
      nb.num = nextNum();
      App.brands.push(nb);
      added++;
    });
    if (added) {
      notifyEvent({ type: "tier" });
      notifyEvent({ type: "data", text: t("import_ok") + " · " + added });
      maintenance(true);
      save();
    }
    return added;
  }

  async function importExcelFile(file) {
    if (!file) return;
    try {
      var buf = new Uint8Array(await file.arrayBuffer());
      if (/\.csv$/i.test(file.name)) {
        var text = new TextDecoder().decode(buf);
        var list = L.parseBrandsText(text);
        finishImport(list);
        return;
      }
      var wb = await X.read(buf);
      var res = X.readWorkbook(wb.sheets, L);
      if (res.error) { toast(t("imp_error")); return; }
      if (res.searchLog && res.searchLog.length) App.searchLog = res.searchLog;
      finishImport(res.brands);
    } catch (e) {
      toast(t("imp_error") + " (" + (e && e.message ? e.message : "read") + ")");
    }
  }

  function importTextGo() {
    var ta = document.getElementById("import-text");
    if (!ta) return;
    var list = L.parseBrandsText(ta.value);
    finishImport(list);
  }

  function finishImport(list) {
    if (!list || !list.length) { toast(t("imp_error")); return; }
    var added = mergeBrands(list);
    var box = document.getElementById("import-result");
    if (box) box.innerHTML = '<div class="ok-box" style="margin-top:10px">' +
      esc(t("imp_result", { n: n(added), d: n(list.length - added) })) + "</div>";
    else toast(t("imp_result", { n: n(added), d: n(list.length - added) }));
    render();
  }

  async function importJsonFile(file) {
    if (!file) return;
    try {
      var txt = await file.text();
      var json = JSON.parse(txt);
      if (json && json.brands && Array.isArray(json.brands)) {
        if (!confirm(t("confirm_q"))) return;
        restoreFromObject(json);
        return;
      }
      var list = L.parseBrandsText(txt);
      finishImport(list);
    } catch (e) {
      toast(t("imp_error"));
    }
  }

  function restoreFromObject(json) {
    App.brands = (json.brands || []).map(function (b) { return Object.assign(L.newBrand({}), b); });
    App.settings = Object.assign({}, L.DEFAULT_SETTINGS, json.settings || {});
    App.notifs = json.notifs || [];
    App.searchLog = json.searchLog || [];
    T.setLang(App.settings.lang || "fa");
    T.setPersianDigits(!!App.settings.persianDigits);
    save();
    closeSheet();
    maintenance(true);
    render();
    toast(t("import_ok"));
  }

  function restoreBackup(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var json = JSON.parse(reader.result);
        if (!json.brands) { toast(t("imp_error")); return; }
        if (!confirm(t("confirm_q"))) return;
        restoreFromObject(json);
      } catch (e) { toast(t("imp_error")); }
    };
    reader.readAsText(file);
  }

  function downloadBlob(bytes, filename, mime) {
    var blob = new Blob([bytes], { type: mime || "application/octet-stream" });
    if (root.navigator && navigator.canShare && navigator.canShare({ files: [new File([blob], filename, { type: mime })] })) {
      /* let the phone offer WhatsApp / OneDrive / Files */
      root.__lastShare = { blob: blob, filename: filename, mime: mime };
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    return { url: url, size: blob.size };
  }

  async function doExport() {
    var box = document.getElementById("export-result");
    if (!App.brands.length) { toast(t("exp_none")); return; }
    if (box) box.innerHTML = '<div class="loading-row"><span class="spin"></span>' + esc(t("exp_working")) + "</div>";
    try {
      var bytes = await X.buildWorkbook(App.brands, App.settings, L);
      var name = "Frasha_Leads_" + today() + ".xlsx";
      var res = downloadBlob(bytes, name,
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      if (box) {
        box.innerHTML = '<div class="ok-box" style="margin-top:12px">✅ ' + esc(t("exp_done")) + "<br>" +
          esc(t("exp_rows")) + ": " + n(App.brands.length) + " · " + esc(t("exp_size")) + ": " +
          n(Math.max(1, Math.round(res.size / 1024))) + " KB<div class='tiny dim' style='margin-top:6px'>" + esc(name) + "</div></div>" +
          '<button class="btn block" style="margin-top:8px" data-act="share-last">📤 ' + esc(t("exp_tip")) + "</button>";
      }
      notifyEvent({ type: "data", text: t("exp_done") });
      save();
    } catch (e) {
      if (box) box.innerHTML = '<div class="warn">' + esc(t("imp_error")) + ": " + esc(e.message || "") + "</div>";
    }
  }

  function doBackup() {
    var payload = {
      app: "frasha-lead-finder", version: APP_VERSION, exportedAt: new Date().toISOString(),
      settings: App.settings, brands: App.brands, notifs: App.notifs, searchLog: App.searchLog
    };
    var bytes = new TextEncoder().encode(JSON.stringify(payload, null, 1));
    downloadBlob(bytes, "Frasha_Backup_" + today() + ".json", "application/json");
    notifyEvent({ type: "data", text: t("backup_file") });
    toast(t("backup_file"));
  }

  /* ------------------------------------------------------------- share */
  document.addEventListener("click", function (e) {
    var el = e.target.closest('[data-act="share-last"]');
    if (!el) return;
    if (root.__lastShare && navigator.canShare) {
      var f = new File([root.__lastShare.blob], root.__lastShare.filename, { type: root.__lastShare.mime });
      navigator.share({ files: [f], title: f.name }).catch(function () { });
    } else {
      toast(t("exp_tip"));
    }
  });

  function handleShareParams() {
    var q = new URLSearchParams(location.search || "");
    if (!q.get("share") && !q.get("text") && !q.get("url")) return;
    var text = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n");
    var p = L.classifyPaste(text);
    var ig = p.igUrl || L.igUrlFrom(text);
    if (ig) {
      var draft = L.newBrand({ igUrl: ig, handle: L.normalizeIg(ig) });
      draft.name = draft.handle;
      App.ui.wizard = { step: 1, draft: draft };
      App.ui.tab = "review";
      setTimeout(function () { openSheet("wizard"); toast(t("share_got")); }, 400);
    }
  }

  /* --------------------------------------------------------- onboarding */
  function onboardingHTML() {
    var steps = [
      ["🧭", "ob1_t", "ob1_b"],
      ["👆", "ob2_t", "ob2_b"],
      ["📴", "ob3_t", "ob3_b"]
    ];
    var i = App.ui.ob || 0;
    var s = steps[i];
    return '<div class="ob"><div class="art">' + s[0] + "</div>" +
      "<h2>" + esc(t(s[1])) + "</h2><p>" + esc(t(s[2])) + "</p>" +
      '<div class="dots">' + steps.map(function (_, k) {
        return "<i class='" + (k === i ? "on" : "") + "'></i>";
      }).join("") + "</div>" +
      '<button class="btn primary block" data-act="ob-next">' + esc(i === 2 ? t("ob_start") : t("next")) + "</button></div>";
  }
  function nextOnboarding() {
    App.ui.ob = (App.ui.ob || 0) + 1;
    if (App.ui.ob > 2) {
      App.settings.onboarded = true;
      var el = document.querySelector(".ob");
      if (el) el.remove();
      save();
      render();
      return;
    }
    var ob = document.querySelector(".ob");
    if (ob) ob.outerHTML = onboardingHTML();
    else renderSheet();
  }

  /* ==================================================================== */
  /*  BOOT                                                                */
  /* ==================================================================== */
  async function boot() {
    var appEl = document.getElementById("app");
    if (appEl && !document.getElementById("content")) {
      appEl.innerHTML = '<div id="topbar"></div><main class="content" id="content"></main>' +
        '<nav id="nav" class="nav"></nav><div id="overlay"></div><div id="toast"></div>';
    }
    var contentEl = document.getElementById("content");
    if (contentEl) contentEl.innerHTML = '<div class="loading-row"><span class="spin"></span>' +
      esc(t("loading")) + "</div>";
    App.storage = await Db.open();
    var data = Db.read();
    if (data) {
      App.settings = Object.assign({}, L.DEFAULT_SETTINGS, data.settings || {});
      App.settings.notif = Object.assign({}, L.DEFAULT_SETTINGS.notif, (data.settings || {}).notif || {});
      App.brands = (data.brands || []).map(function (b) { return Object.assign(L.newBrand({}), b); });
      App.notifs = data.notifs || [];
      App.searchLog = data.searchLog || [];
    }
    T.setLang(App.settings.lang || "fa");
    T.setPersianDigits(!!App.settings.persianDigits);
    App.ready = true;
    maintenance(true);
    render();
    if (!App.settings.onboarded) {
      var holder = document.getElementById("overlay") || document.body;
      holder.insertAdjacentHTML("beforeend", onboardingHTML());
    }
    handleShareParams();
    /* once-a-day status check while the app stays open */
    setInterval(function () {
      var before = JSON.stringify(App.brands.map(function (b) { return b.list + "|" + b.statusDate; }));
      maintenance(true);
      var after = JSON.stringify(App.brands.map(function (b) { return b.list + "|" + b.statusDate; }));
      if (before !== after) render();
    }, 60 * 60 * 1000);
    root.FrashaApp = { App: App, render: render, go: go, openSheet: openSheet };
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})(window);

</script>
