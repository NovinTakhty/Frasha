<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08161F">
<meta name="description" content="Frasha Lead Finder — offline lead tracker for an AI creative agency">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Frasha Lead Finder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230E2130%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2217%22%20fill%3D%22none%22%20stroke%3D%22%232FD3C0%22%20stroke-width%3D%226%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%227%22%20fill%3D%22%232FD3C0%22%2F%3E%3C%2Fsvg%3E">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#08161F; --bg2:#0C2130; --card:#102A3B; --card2:#143444; --line:#1E4054;
  --text:#EAF4F8; --muted:#8FA9B8; --dim:#6B8798;
  --teal:#2FD3C0; --teal-d:#12988B; --blue:#4EA8DE;
  --green:#37D67A; --amber:#F5B942; --red:#F26D6D; --grey:#5C7488;
  --r:18px; --r-sm:12px; --pad:16px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --nav-h:64px;
  font-synthesis-weight:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #10344A 0%, var(--bg) 55%) var(--bg);
  color:var(--text);
  font-family:"Vazirmatn","IRANSans","SF Pro Text",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-size:16px;line-height:1.55;letter-spacing:.1px;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--teal);text-decoration:none}
.app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.content{flex:1;padding:14px var(--pad) calc(var(--nav-h) + 26px);animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:12px var(--pad);background:linear-gradient(180deg,rgba(8,22,31,.96),rgba(8,22,31,.86));
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15;flex:1;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:.2px}
.brand span{font-size:11.5px;color:var(--muted)}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  background:var(--card);border:1px solid var(--line);font-size:19px;position:relative}
.icon-btn:active{transform:scale(.95)}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

/* ---------- bottom nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;height:var(--nav-h);
  max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(9,26,36,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--dim);font-size:11px;font-weight:600;transition:color .15s}
.nav button .ico{font-size:20px;line-height:1}
.nav button.on{color:var(--teal)}
.nav button.on .ico{filter:drop-shadow(0 0 8px rgba(47,211,192,.45))}

/* ---------- cards ---------- */
.card{background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:var(--r);padding:var(--pad);box-shadow:var(--shadow);animation:pop .18s ease}
.card + .card{margin-top:12px}
.card.flat{box-shadow:none;background:var(--card)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.bold{font-weight:700} .center{text-align:center}
.stack > * + *{margin-top:10px}
.divider{height:1px;background:var(--line);margin:12px 0}
h1,h2,h3{margin:0;font-weight:700}
h1{font-size:20px} h2{font-size:16px} h3{font-size:14px;color:var(--muted);font-weight:600}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px}
.section-title h3{font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}

/* ---------- progress ring ---------- */
.ring{display:grid;place-items:center;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .ring-num{position:absolute;text-align:center;line-height:1.05}
.ring .ring-num b{font-size:26px;font-weight:800;display:block}
.ring .ring-num span{font-size:11px;color:var(--muted)}

/* ---------- tiers ---------- */
.tier{display:flex;align-items:center;gap:10px;padding:9px 0}
.tier .tnum{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:800;
  font-size:14px;background:rgba(47,211,192,.12);color:var(--teal);border:1px solid rgba(47,211,192,.25)}
.tier .tbar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.tier .tbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal-d),var(--teal))}
.tier .tcount{font-size:13px;color:var(--muted);min-width:34px;text-align:end;font-variant-numeric:tabular-nums}

/* ---------- light row (4 criteria) ---------- */
.lights{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.light{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 6px;text-align:center;transition:.2s}
.light .dot{width:12px;height:12px;border-radius:50%;margin:0 auto 6px;background:var(--grey);box-shadow:0 0 0 4px rgba(92,116,136,.16)}
.light.pass .dot{background:var(--green);box-shadow:0 0 0 4px rgba(55,214,122,.16)}
.light.fail .dot{background:var(--red);box-shadow:0 0 0 4px rgba(242,109,109,.16)}
.light.review .dot{background:var(--amber);box-shadow:0 0 0 4px rgba(245,185,66,.16)}
.light .lbl{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.light.pass{border-color:rgba(55,214,122,.35)} .light.fail{border-color:rgba(242,109,109,.35)}
.light.review{border-color:rgba(245,185,66,.35)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;
  min-height:52px;padding:0 18px;border-radius:15px;font-weight:700;font-size:15.5px;
  background:var(--card2);border:1px solid var(--line);color:var(--text);transition:.15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,#33DBC7,#17A698);border-color:transparent;color:#062019;
  box-shadow:0 8px 22px rgba(47,211,192,.28)}
.btn.danger{background:rgba(242,109,109,.14);border-color:rgba(242,109,109,.4);color:#FFC9C9}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:40px;padding:0 10px;font-size:13px;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.xs{min-height:32px;padding:0 10px;font-size:12px;border-radius:10px}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-row.three{grid-template-columns:1.2fr .9fr .9fr}

/* ---------- inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.input,select.input,textarea.input{
  width:100%;min-height:50px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);color:var(--text);outline:none;transition:.15s}
.input:focus{border-color:var(--teal);background:rgba(47,211,192,.07)}
.input::placeholder{color:#5e7787}
textarea.input{min-height:96px;resize:vertical;line-height:1.7}
.input.num{font-variant-numeric:tabular-nums;letter-spacing:.5px}
.hint{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:flex-start;line-height:1.5}
.inline-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* segmented */
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;padding:0 10px}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.seg.teal button.on{background:rgba(47,211,192,.16);color:var(--teal)}
.seg.green button.on{background:rgba(55,214,122,.16);color:var(--green)}
.seg.red button.on{background:rgba(242,109,109,.16);color:#FFC9C9}

/* stepper */
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.stepper button{height:54px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:22px;font-weight:700}
.stepper .val{height:54px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);
  display:grid;place-items:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}

/* stars */
.stars{display:flex;gap:6px;direction:ltr;justify-content:flex-start}
.stars button{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  font-size:19px;color:#3E5C6E;display:grid;place-items:center;transition:.12s}
.stars button.on{color:var(--amber);background:rgba(245,185,66,.12);border-color:rgba(245,185,66,.4);transform:translateY(-1px)}

/* ---------- pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:700;
  background:rgba(255,255,255,.07);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.high{background:rgba(55,214,122,.14);color:#8BF0B3;border-color:rgba(55,214,122,.3)}
.pill.medium{background:rgba(78,168,222,.14);color:#A9D6F5;border-color:rgba(78,168,222,.3)}
.pill.low{background:rgba(255,255,255,.06);color:var(--muted)}
.pill.review{background:rgba(245,185,66,.14);color:#FFD98A;border-color:rgba(245,185,66,.3)}
.pill.fail{background:rgba(242,109,109,.14);color:#FFB4B4;border-color:rgba(242,109,109,.3)}
.pill.teal{background:rgba(47,211,192,.14);color:#9DF0E4;border-color:rgba(47,211,192,.3)}
.chips{display:flex;gap:7px;flex-wrap:wrap}

/* ---------- list rows ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:15px;
  background:linear-gradient(170deg,var(--card),var(--card2));border:1px solid var(--line)}
.item:active{transform:scale(.995)}
.item .ava{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;
  background:rgba(47,211,192,.12);color:var(--teal);border:1px solid rgba(47,211,192,.22);flex:0 0 auto}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}

/* ---------- sheet / overlay ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(3,12,18,.66);backdrop-filter:blur(3px);animation:fade .16s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(180deg,#102A3B,#0C2230);border:1px solid var(--line);border-bottom:0;
  border-radius:24px 24px 0 0;padding:8px var(--pad) calc(20px + env(safe-area-inset-bottom));
  animation:up .22s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet .handle{width:44px;height:4px;border-radius:99px;background:#2A4C60;margin:8px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{font-size:17px}

/* toast */
.toast{position:fixed;bottom:calc(var(--nav-h) + 14px);left:50%;transform:translateX(-50%);
  z-index:80;background:#0F2A3A;border:1px solid var(--line);color:var(--text);
  padding:11px 16px;border-radius:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;
  max-width:92vw;animation:pop .18s}
.toast button{color:var(--teal);font-weight:800;font-size:13.5px;white-space:nowrap}

/* empty state */
.empty{text-align:center;padding:44px 18px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.8}
.empty p{margin:6px 0 16px;font-size:13.5px}

/* onboarding */
.ob{position:fixed;inset:0;z-index:90;background:linear-gradient(180deg,#0B2230,#08161F);
  display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:560px;margin:0 auto}
.ob .art{font-size:64px;text-align:center;margin-bottom:22px}
.ob h2{font-size:24px;text-align:center;margin-bottom:8px}
.ob p{color:var(--muted);text-align:center;font-size:15px;line-height:1.8}
.ob .dots{display:flex;gap:7px;justify-content:center;margin:26px 0}
.ob .dots i{width:7px;height:7px;border-radius:50%;background:#2C4C5F}
.ob .dots i.on{background:var(--teal);width:20px;border-radius:99px}

/* misc */
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--dim)} .kv dd{margin:0;text-align:end;font-weight:600}
.shot{width:100%;border-radius:14px;border:1px solid var(--line);margin-top:8px}
.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.progress-line{height:9px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.progress-line i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-d),var(--teal))}
.warn{background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.3);color:#FFE2A3;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.6}
.info{background:rgba(78,168,222,.1);border:1px solid rgba(78,168,222,.3);color:#BFE2F8;padding:10px 12px;border-radius:12px;font-size:12.5px;line-height:1.7}
.ok-box{background:rgba(55,214,122,.1);border:1px solid rgba(55,214,122,.3);color:#B7F5CE;padding:10px 12px;border-radius:12px;font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
.mono{font-variant-numeric:tabular-nums}
.copy-box{background:rgba(255,255,255,.04);border:1px dashed var(--line);border-radius:12px;padding:10px;
  font-size:12.5px;color:var(--muted);white-space:pre-wrap;max-height:180px;overflow:auto;line-height:1.6}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.18);border-top-color:var(--teal);
  animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;padding:14px 0}
[dir=rtl] .flip{transform:scaleX(-1)}
@media (min-width:600px){ body{font-size:16.5px} .content{padding-top:18px} }
</style>
</head>
<body>
<div class="app" id="app">
<div id="topbar"></div><main class="content" id="content"></main>
<nav id="nav" class="nav"></nav><div id="overlay"></div><div id="toast"></div>
</div>
<noscript><p style="padding:20px;color:#eee">This app needs JavaScript.</p></noscript>

<script>
/* =====================================================================
   Frasha Lead Finder — logic.js   (pure functions, no DOM, Node-testable)
   ---------------------------------------------------------------------
   The qualification rules here are an exact mirror of the Excel workbook
   formulas built in phase 1 (build_workbook.py):
     fail  = followers >= max  OR  post older than window / in the future
             OR Contact Verified = "No"
     pass  = followers <  max  AND post inside window AND AI Fit 1..5
             AND Contact Verified = "Yes" AND (WhatsApp number OR link)
     else  = REVIEW   (missing data is never a failure)
   All thresholds (10 / 7 / 15) come from settings — nothing is hard-coded.
   ===================================================================== */
(function (root) {
  "use strict";

  var DAY = 86400000;

  var LISTS = { POOL: "pool", FINAL: "final", ENG: "engagement", WAIT: "waiting",
    CUST: "customers", SUSP: "suspended", ARCH: "archive" };

  var STATUS = {
    NOT_CONTACTED: "Not contacted", READY: "Ready to contact", SENT: "Message sent",
    SEEN_NO_REPLY: "Seen - no reply", SEEN_REPLIED: "Seen - replied",
    ASKED_TIME: "Asked for time", ORDERED: "Ordered", NOT_AGREED: "Not agreed",
    EXPIRED: "Expired (no response)", SUSPENDED: "Suspended", NOT_FIT: "Not a fit"
  };

  var REASONS = {
    REJECTED: "Rejected by me", AUTO: "Auto-rejected", NOT_AGREED: "Not agreed",
    CANCELLED: "Deal cancelled", EXPIRED: "Expired (no response)",
    SEEN_NO_REPLY: "Seen - no reply"
  };

  var DEFAULT_SETTINGS = {
    window: 10, outreachWait: 7, waitlistDays: 15, target: 100, maxFollowers: 50000,
    lang: "fa", persianDigits: false, onboarded: false,
    notif: { reply: true, moved: true, timer: true, suspended: true, slot: true, tier: true, data: true }
  };

  /* ---------------------------------------------------------------- dates */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function toISO(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayISO(d) { return toISO(d || new Date()); }
  function parseISO(s) {
    if (!s) return null;
    var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return null;
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  function addDays(iso, n) {
    var d = parseISO(iso); if (!d) return null;
    d.setDate(d.getDate() + n); return toISO(d);
  }
  /** whole days from aISO to bISO (b - a), both local midnights */
  function daysBetween(aISO, bISO) {
    var a = parseISO(aISO), b = parseISO(bISO);
    if (!a || !b) return null;
    return Math.round((b - a) / DAY);
  }
  /** accept Persian/Arabic digits and turn a date into ISO if possible */
  function normalizeDigits(s) {
    return String(s == null ? "" : s)
      .replace(/[\u06F0-\u06F9]/g, function (c) { return String(c.charCodeAt(0) - 0x06F0); })
      .replace(/[\u0660-\u0669]/g, function (c) { return String(c.charCodeAt(0) - 0x0660); })
      .replace(/[\u066B\u066C\u060C]/g, ",");   /* Arabic/Persian decimal + thousands separators */
  }

  /* ------------------------------------------------------ criteria engine */
  function num(v) {
    if (v === null || v === undefined || v === "") return null;
    var n = Number(normalizeDigits(v).replace(/[,\s]/g, ""));
    return isNaN(n) ? null : n;
  }

  function criteria(b, s, today) {
    s = s || DEFAULT_SETTINGS; today = today || todayISO();
    var w = num(s.window) || 10, maxF = num(s.maxFollowers) || 50000;
    var out = {};

    /* 1 — followers */
    var f = num(b.followers);
    if (f === null) out.followers = { state: "unknown" };
    else if (f >= maxF) out.followers = { state: "fail", note: f };
    else out.followers = { state: "pass", note: f };

    /* 2 — recency window: today back to (window-1) days ago, inclusive */
    var d = b.lastPostDate && parseISO(b.lastPostDate) ? b.lastPostDate
      : (b.lastPostDate ? null : null);
    if (!d) out.recent = { state: "unknown" };
    else {
      var age = daysBetween(d, today);
      if (age === null) out.recent = { state: "unknown" };
      else if (age < 0) out.recent = { state: "fail", note: age, future: true };
      else if (age >= w) out.recent = { state: "fail", note: age };
      else out.recent = { state: "pass", note: age };
    }

    /* 3 — AI fit entered 1..5 (a scored brand counts as assessed) */
    var ai = num(b.aiFit);
    out.fit = (ai !== null && ai >= 1 && ai <= 5) ? { state: "pass", note: ai } : { state: "unknown" };

    /* 4 — public WhatsApp + manual verification */
    var hasWA = !!(b.waNumber || b.waLink);
    if (b.contactVerified === "No") out.contact = { state: "fail" };
    else if (b.contactVerified === "Yes" && hasWA) out.contact = { state: "pass" };
    else out.contact = { state: "unknown", note: hasWA ? "unverified" : "missing" };

    var states = [out.followers.state, out.recent.state, out.fit.state, out.contact.state];
    var anyFail = states.indexOf("fail") !== -1;
    var allPass = states.every(function (x) { return x === "pass"; });
    out.result = anyFail ? "NO" : (allPass ? "YES" : "REVIEW");
    out.confirmed = states.filter(function (x) { return x === "pass"; }).length;
    out.known = knownFields(b);
    out.fails = [];
    if (out.followers.state === "fail") out.fails.push("followers");
    if (out.recent.state === "fail") out.fails.push("recent");
    if (out.contact.state === "fail") out.fails.push("contact");
    return out;
  }

  function knownFields(b) {
    var fields = ["name", "country", "niche", "igUrl", "followers", "lastPostDate",
      "website", "email", "waNumber", "waLink", "aiFit", "visual"];
    var n = 0;
    fields.forEach(function (k) {
      if (b[k] !== null && b[k] !== undefined && b[k] !== "") n++;
    });
    if (b.contactVerified && b.contactVerified !== "Pending") n++;
    return n;
  }

  function failReasonText(b, c, s) {
    s = s || DEFAULT_SETTINGS;
    if (c.followers.state === "fail") return "followers:" + b.followers + ">=" + (s.maxFollowers || 50000);
    if (c.recent.state === "fail") {
      return c.recent.future ? "recent:future" : "recent:" + c.recent.note + "d>" + (s.window || 10);
    }
    if (c.contact.state === "fail") return "contact:verified=No";
    return "";
  }

  /** confirmed failure => auto-reject into Archive (returns detail text or null) */
  function autoRejectInfo(b, s, today) {
    var c = criteria(b, s, today);
    if (c.result !== "NO") return null;
    return { detail: failReasonText(b, c, s), criteria: c };
  }

  /* ------------------------------------------------------------ priority */
  function priorityOf(b) {
    var c = criteria(b);
    if (c.result === "NO") return { label: "Not qualified", score: null, tier: "none" };
    var p = num(b.aiFit), q = num(b.visual);
    if (p === null || q === null || p < 1 || p > 5 || q < 1 || q > 5)
      return { label: "Review", score: null, tier: "review" };
    var score = (6 - q) + p;                       /* 2..10 */
    var tier = score >= 8 ? "High" : (score >= 6 ? "Medium" : "Low");
    return { label: tier, score: score, tier: tier };
  }

  /** pool ranking: confirmed criteria (4..0) → known fields → priority score */
  function rankCompare(a, b) {
    var ca = criteria(a), cb = criteria(b);
    if (cb.confirmed !== ca.confirmed) return cb.confirmed - ca.confirmed;
    if (cb.known !== ca.known) return cb.known - ca.known;
    var pa = priorityOf(a).score, pb = priorityOf(b).score;
    /* a pushed-back brand sinks to the end of its band */
    var pushA = a.pushedBack || 0, pushB = b.pushedBack || 0;
    if (pushA !== pushB) return pushA - pushB;
    if (pa === null && pb === null) return 0;
    if (pa === null) return 1;
    if (pb === null) return -1;
    return pb - pa;
  }

  function poolBrands(brands) {
    return brands.filter(function (b) { return b.list === LISTS.POOL; }).sort(rankCompare);
  }

  function tierCounts(brands) {
    var t = { 4: 0, 3: 0, 2: 0, 1: 0, 0: 0 };
    brands.forEach(function (b) {
      if (b.list !== LISTS.POOL) return;
      t[criteria(b).confirmed] += 1;
    });
    return t;
  }

  /* ------------------------------------------------------------ lifecycle */
  function uid(prefix) {
    return (prefix || "b") + "_" + Date.now().toString(36) + "_" +
      Math.random().toString(36).slice(2, 7);
  }

  function newBrand(partial) {
    var b = {
      id: uid(), num: null, createdAt: new Date().toISOString(), updatedAt: null,
      dateFound: todayISO(), name: "", country: "", niche: "", igUrl: "", handle: "",
      followers: null, lastPostDate: null, website: "", email: "", waNumber: "", waLink: "",
      contactVerified: "Pending", aiFit: null, visual: null, notes: "", source: "",
      screenshot: "", outreach: STATUS.NOT_CONTACTED, statusDate: null,
      contactDate: null, nextFollowup: null, pushedBack: 0, approved: false,
      list: LISTS.POOL, archiveReason: "", archiveDetail: "", history: [],
      lastNotice: ""
    };
    Object.keys(partial || {}).forEach(function (k) { if (partial[k] !== undefined) b[k] = partial[k]; });
    return b;
  }

  function clone(b) { return JSON.parse(JSON.stringify(b)); }

  function event(type, b, extra) {
    var e = { type: type, brandId: b.id, name: b.name, list: b.list, ts: new Date().toISOString() };
    if (extra) Object.keys(extra).forEach(function (k) { e[k] = extra[k]; });
    return e;
  }

  function logHistory(b, from, to, note) {
    b.history = b.history || [];
    b.history.push({ from: from, to: to, date: todayISO(), note: note || "" });
    if (b.history.length > 60) b.history.shift();
  }

  function moveTo(b, list, status, today, note) {
    var from = b.list;
    b.list = list;
    if (status) b.outreach = status;
    b.statusDate = (list === LISTS.POOL || list === LISTS.ARCH) && !status ? null : today;
    b.updatedAt = new Date().toISOString();
    logHistory(b, from, list, note);
    return b;
  }

  /* --- transitions: one function per transition (brief 4) --------------- */

  function approve(b, today) {
    b = clone(b);
    b.approved = true;
    var c = criteria(b);
    if (c.result !== "YES") return { brand: b, ok: false, reason: "not4of4" };
    moveTo(b, LISTS.FINAL, STATUS.READY, today, "approved");
    return { brand: b, ok: true, event: event("moved", b, { list: LISTS.FINAL }) };
  }

  function reject(b, today, reason, detail) {
    b = clone(b);
    b.archiveReason = reason || REASONS.REJECTED;
    b.archiveDetail = detail || "";
    moveTo(b, LISTS.ARCH, STATUS.NOT_FIT, today, "rejected");
    return { brand: b, event: event("moved", b, { list: LISTS.ARCH }) };
  }

  function pushBack(b) {
    b = clone(b);
    b.pushedBack = (b.pushedBack || 0) + 1;
    b.updatedAt = new Date().toISOString();
    return { brand: b };
  }

  function markMessageSent(b, today) {
    b = clone(b);
    b.outreach = STATUS.SENT;
    b.statusDate = today;
    b.contactDate = b.contactDate || today;
    logHistory(b, b.list, b.list, "message sent");
    b.updatedAt = new Date().toISOString();
    return { brand: b, event: event("moved", b, { list: LISTS.FINAL, status: STATUS.SENT }) };
  }

  function markSeenNoReply(b, today) {
    b = clone(b);
    b.archiveReason = REASONS.SEEN_NO_REPLY;
    b.archiveDetail = "seen, no reply";
    moveTo(b, LISTS.ARCH, STATUS.SEEN_NO_REPLY, today, "seen - no reply");
    return { brand: b, event: event("moved", b, { list: LISTS.ARCH }), slotFreed: true };
  }

  function markSeenReplied(b, today) {
    b = clone(b);
    moveTo(b, LISTS.ENG, STATUS.SEEN_REPLIED, today, "seen - replied");
    return { brand: b, event: event("moved", b, { list: LISTS.ENG }), reply: true, slotFreed: true };
  }

  function engagementOrdered(b, today) {
    b = clone(b);
    b.orderDate = today;
    moveTo(b, LISTS.CUST, STATUS.ORDERED, today, "ordered");
    return { brand: b, event: event("moved", b, { list: LISTS.CUST }), reply: true };
  }

  function engagementNotAgreed(b, today) {
    b = clone(b);
    b.archiveReason = REASONS.NOT_AGREED;
    b.archiveDetail = "engagement: not agreed";
    moveTo(b, LISTS.ARCH, STATUS.NOT_AGREED, today, "not agreed");
    return { brand: b, event: event("moved", b, { list: LISTS.ARCH }), reply: true };
  }

  function engagementAskedTime(b, today) {
    b = clone(b);
    moveTo(b, LISTS.WAIT, STATUS.ASKED_TIME, today, "asked for time");
    return { brand: b, event: event("moved", b, { list: LISTS.WAIT }), reply: true };
  }

  function customerRemove(b, today) {
    b = clone(b);
    b.archiveReason = REASONS.CANCELLED;
    b.archiveDetail = "deal cancelled";
    moveTo(b, LISTS.ARCH, STATUS.NOT_FIT, today, "deal cancelled");
    return { brand: b, event: event("moved", b, { list: LISTS.ARCH }) };
  }

  function suspend(b, today) {
    b = clone(b);
    b.archiveReason = "Suspended";
    b.archiveDetail = "15 days in Waiting List with no change";
    moveTo(b, LISTS.SUSP, STATUS.SUSPENDED, today, "waiting list expired");
    return { brand: b, event: event("suspended", b, { list: LISTS.SUSP }) };
  }

  /** restore = back to the Pool untouched, timer zero; only by an explicit tap */
  function restore(b, today) {
    b = clone(b);
    b.archiveReason = "";
    b.archiveDetail = "";
    b.approved = false;
    b.outreach = STATUS.NOT_CONTACTED;
    b.statusDate = null;
    b.pushedBack = 0;
    moveTo(b, LISTS.POOL, STATUS.NOT_CONTACTED, today, "restored");
    b.statusDate = null;
    return { brand: b, event: event("moved", b, { list: LISTS.POOL }) };
  }

  /* -------------------------------------------------------------- timers */
  function timerInfo(b, s, today) {
    s = s || DEFAULT_SETTINGS; today = today || todayISO();
    if (!b.statusDate) return null;
    var day = daysBetween(b.statusDate, today);
    if (day === null) return null;
    if (b.list === LISTS.FINAL && b.outreach === STATUS.SENT) {
      var w = num(s.outreachWait) || 7;
      return { kind: "outreach", day: day + 1, total: w, daysLeft: Math.max(0, w - day),
        state: day >= w ? "expired" : (day >= w - 2 ? "due" : "ok"),
        dueISO: addDays(b.statusDate, w) };
    }
    if (b.list === LISTS.WAIT) {
      var wl = num(s.waitlistDays) || 15;
      return { kind: "waiting", day: day + 1, total: wl, daysLeft: Math.max(0, wl - day),
        state: day >= wl ? "expired" : (day >= wl - 3 ? "due" : "ok"),
        dueISO: addDays(b.statusDate, wl) };
    }
    if (b.list === LISTS.ENG) {
      return { kind: "engagement", day: day + 1, total: null, daysLeft: null, state: "ok" };
    }

  }

  /** automatic transitions run on open + once a day while open */
  function runStatusCheck(brands, s, today, opts) {
    opts = opts || {};

    brands = brands.map(function (orig) {
      var b = orig;
      var t = timerInfo(b, s, today);
      if (t && t.kind === "outreach" && t.state === "expired") {

        b.archiveReason = REASONS.EXPIRED;
        b.archiveDetail = "no reply after " + (num(s.outreachWait) || 7) + " days";
        moveTo(b, LISTS.ARCH, STATUS.EXPIRED, today, "outreach expired");
        changed.push(b.id); events.push(event("moved", b, { list: LISTS.ARCH }));

        }

        }
      } else if (opts.notice && t && t.state === "due" && b.lastNotice !== today) {

    });

      if (!info) return orig;
      var b = clone(orig);
      b.archiveReason = REASONS.AUTO;
      b.archiveDetail = info.detail;

      return b;

  }

  /** Final 100 top-up: approved 4/4 brands from the Pool fill open slots */
  function autoFillFinal(brands, s, today) {

    var inFinal = brands.filter(function (b) { return b.list === LISTS.FINAL; }).length;
    var open = Math.max(0, target - inFinal);
    var events = [], filled = 0;
    if (open <= 0) return { brands: brands, events: events, filled: 0, open: 0 };
    var candidates = brands.filter(function (b) {
      return b.list === LISTS.POOL && b.approved && criteria(b, s, today).result === "YES";
    }).sort(rankCompare);
    var ids = {};
    candidates.slice(0, open).forEach(function (b) { ids[b.id] = true; });
    if (!Object.keys(ids).length) return { brands: brands, events: events, filled: 0, open: open };
    brands = brands.map(function (orig) {
      if (!ids[orig.id]) return orig;
      var b = clone(orig);
      moveTo(b, LISTS.FINAL, STATUS.READY, today, "auto-filled a slot");
      filled++;
      events.push(event("slot", b, { filled: true }));
      return b;
    });
    return { brands: brands, events: events, filled: filled, open: open - filled };
  }

  function finalOpenSlots(brands, s) {
    var target = num(s.target) || 100;
    return Math.max(0, target - brands.filter(function (b) { return b.list === LISTS.FINAL; }).length);
  }

  /* --------------------------------------------------------- smart paste */
  function parseFollowers(text) {
    if (text === null || text === undefined) return null;
    var s = normalizeDigits(String(text)).toLowerCase();
    var m = s.match(/(\d[\d.,\s]*)\s*(k|m|\u0647\u0632\u0627\u0631|\u0645\u06cc\u0644\u06cc\u0648\u0646)?/);
    if (!m) return null;
    var suffix = m[2] || "";
    var mult = (suffix === "k" || suffix === "\u0647\u0632\u0627\u0631") ? 1000
      : ((suffix === "m" || suffix === "\u0645\u06cc\u0644\u06cc\u0648\u0646") ? 1000000 : 1);
    var raw = m[1].trim().replace(/\s/g, "");
    if (mult === 1) {
      if (/^\d{1,3}(\.\d{3})+$/.test(raw)) raw = raw.replace(/\./g, "");   /* 12.400 -> 12400 */
      raw = raw.replace(/,/g, "");
    } else {
      if (raw.indexOf(".") !== raw.lastIndexOf(".")) raw = raw.replace(/\./g, "");
      raw = raw.replace(/,/g, "");
    }
    var n = parseFloat(raw) * mult;
    return isNaN(n) ? null : Math.round(n);
  }

  function normalizeIg(url) {
    if (!url) return "";
    var s = String(url).trim().toLowerCase();
    s = s.replace(/^https?:\/\//, "").replace(/^www\./, "");
    s = s.replace(/^instagram\.com\//, "");
    s = s.split("?")[0].split("#")[0];
    s = s.split("/")[0];
    s = s.replace(/^@/, "");
    return s.replace(/[^a-z0-9._]/g, "");
  }

  function igUrlFrom(input) {
    if (!input) return "";
    var s = String(input).trim();
    if (/^@?[a-z0-9._]{1,30}$/i.test(s)) return "https://instagram.com/" + s.replace(/^@/, "");
    s = normalizeDigits(s);
    var m = s.match(/(?:instagram\.com\/|^@)([A-Za-z0-9._]{1,30})/);
    if (m) return "https://instagram.com/" + m[1];
    if (/^https?:\/\//i.test(s)) return s;
    return "";
  }

  /** read any pasted blob and put every recognisable piece in the right field */
  function classifyPaste(text) {
    var out = { raw: String(text || "") };
    var s = String(text || "");
    if (!s) return out;
    var wa = s.match(/(?:https?:\/\/)?(?:wa\.me\/|api\.whatsapp\.com\/send\?phone=)(\+?\d{6,15})/i);

  function sheetXml(sheet) {

    out.push('<dimension ref="A1:' + colName(Math.max(0, (sheet.width || 1) - 1)) + Math.max(1, sheet.rows.length) + '"/>');
    out.push('<sheetViews><sheetView rightToLeft="1" workbookViewId="0">' +
      (sheet.freeze ? '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' : "") +
      '</sheetView></sheetViews>');

    if (sheet.cols && sheet.cols.length) {

      sheet.cols.forEach(function (w, i) {

      });
      out.push("</cols>");
    }
    out.push("<sheetData>");
    sheet.rows.forEach(function (row, ri) {
      if (!row || !row.length) { return; }

      if (sheet.height && sheet.height[ri]) attrs += ' ht="' + sheet.height[ri] + '" customHeight="1"';

  var CT_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +

  /* ------------------------------------------------------------------ read */
  function textOf(xml, tag) {
    var out = [], re = new RegExp("<" + tag + "[^>]*>([\\s\\S]*?)</" + tag + ">", "g"), m;
    while ((m = re.exec(xml))) out.push(m[1]);
    return out;
  }
  function plainText(xml) {                     /* all <t> inside a string item */
    var parts = [], re = /<t[^>]*>([\s\S]*?)<\/t>/g, m;
    while ((m = re.exec(xml))) parts.push(unesc(m[1]));
    return parts.join("");
  }

  function parseSheet(xml, shared) {
    var rows = [];
    var rowRe = /<row[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g, rm;
    while ((rm = rowRe.exec(xml))) {
      var rIdx = parseInt(rm[1], 10) - 1;
      var inner = rm[2];
      var cells = [];
      var cellRe = /<c\b([^>]*)\/>|<c\b([^>]*)>([\s\S]*?)<\/c>/g, cm;
      while ((cm = cellRe.exec(inner))) {
        var attrs = cm[1] || cm[2] || "";
        var body = cm[3] || "";
        var refM = attrs.match(/r="([A-Z]+\d+)"/);
        if (!refM) continue;
        var ci = colIndex(refM[1]);
        var tM = attrs.match(/t="([^"]+)"/);
        var type = tM ? tM[1] : "n";
        var vM = body.match(/<v[^>]*>([\s\S]*?)<\/v>/);
        var raw = vM ? unesc(vM[1]) : "";
        var value;
        if (type === "inlineStr") {
          value = plainText(body);
        } else if (type === "s") {
          value = shared[parseInt(raw, 10)] || "";
        } else if (type === "str" || type === "e") {
          value = raw;
        } else if (type === "b") {
          value = raw === "1";
        } else {
          value = raw === "" ? "" : Number(raw);
        }
        cells[ci] = value;
      }
      rows[rIdx] = cells;
    }
    for (var i = 0; i < rows.length; i++) if (!rows[i]) rows[i] = [];
    return rows;
  }

  /** Uint8Array -> Promise<{sheets:[{name, rows}]}> */
  function read(buf) {
    return unzip(buf).then(function (entries) {
      var map = {};
      entries.forEach(function (e) { map[e.name] = e.data; });
      var dec2 = dec;
      var wbXml = map["xl/workbook.xml"] ? dec2.decode(map["xl/workbook.xml"]) : null;
      if (!wbXml) throw new Error("not-a-workbook");
      var relsXml = map["xl/_rels/workbook.xml.rels"] ? dec2.decode(map["xl/_rels/workbook.xml.rels"]) : "";
      var relMap = {};
      /* attribute order differs between writers (openpyxl puts Type first, we put Id first),
         so read each attribute independently instead of relying on order */
      var relRe = /<Relationship\b([^>]*)\/?>/g, rrm;
      while ((rrm = relRe.exec(relsXml))) {
        var attr = rrm[1];
        var idM = attr.match(/\bId="([^"]+)"/);
        var tgM = attr.match(/\bTarget="([^"]+)"/);
        if (!idM || !tgM) continue;
        var tg = tgM[1].replace(/^\/+/, "");
        if (tg.indexOf("xl/") !== 0) tg = "xl/" + tg.replace(/^\.\//, "");
        relMap[idM[1]] = tg;
      }
      var shared = [];
      if (map["xl/sharedStrings.xml"]) {
        var ssXml = dec2.decode(map["xl/sharedStrings.xml"]);
        textOf(ssXml, "si").forEach(function (si) { shared.push(plainText(si)); });
      }
      var out = [];
      var shRe = /<sheet\b([^>]*?)\/?>/g, sm;
      while ((sm = shRe.exec(wbXml))) {
        var a = sm[1];
        var nameM = a.match(/\bname="([^"]+)"/);
        var ridM = a.match(/\br:id="([^"]+)"/) || a.match(/\bid="([^"]+)"/);
        if (!nameM || !ridM) continue;
        var target = relMap[ridM[1]];
        if (!target || !map[target]) continue;
        out.push({ name: unesc(nameM[1]), rows: parseSheet(dec2.decode(map[target]), shared) });
      }
      return { sheets: out };
    });
  }

  function sheetToObjects(sheet) {
    if (!sheet || !sheet.rows.length) return [];
    var head = (sheet.rows[0] || []).map(function (v) { return String(v || "").trim().toLowerCase(); });
    var out = [];
    for (var i = 1; i < sheet.rows.length; i++) {
      var r = sheet.rows[i] || [];

      var o = {}, any = false;
      head.forEach(function (h, ci) {
        if (!h) return;
        var v = r[ci];
        if (v !== undefined && v !== null && v !== "") { o[h] = v; any = true; }

      if (any) out.push(o);
    }
    return out;
  }

        source: o["source / discovery method"] || o["source"],
        followers: o["followers"],
        last_post_date: o["last post date"],
        ai_fit: o["ai fit (1-5)"] || o["ai fit"],
        visual_opportunity: o["visual opportunity (1-5)"] || o["visual opportunity"],
        contact_verified: o["contact verified?"] || o["contact verified"]
      });
      if (!b) { skipped++; return; }
      var key = b.handle || ("n:" + b.name.toLowerCase());
      if (seen[key]) { skipped++; return; }
      seen[key] = 1;
      b.num = o["id"] ? Number(o["id"]) : null;
      b.outreach = o["outreach status"] || b.outreach;
      b.contactDate = dateStr(o["contact date"]);
      b.nextFollowup = dateStr(o["next follow-up"]);
      b.dateFound = dateStr(o["date found"]) || b.dateFound;
      brands.push(b);
    });

    /* list membership from the pipeline sheets */
    function members(sheetName) {
      var sh = byName[sheetName];
      if (!sh) return [];
      return sheetToObjects(sh).filter(function (o) { return o["brand name"] || o["brand id"]; });
    }
    var finals = members("final 100");
    var outs = members("outreach status");
    var engs = members("engagement");
    var waits = members("waiting list");
    var custs = members("customers");
    var susps = members("suspended");
    var archs = members("archive");

    function findBrand(o) {
      var id = o["brand id"] !== undefined ? Number(o["brand id"]) : (o["id"] !== undefined ? Number(o["id"]) : null);
      var name = String(o["brand name"] || "").trim().toLowerCase();
      for (var i = 0; i < brands.length; i++) {
        if (id !== null && !isNaN(id) && Number(brands[i].num) === id) return brands[i];
      }
      for (var j = 0; j < brands.length; j++) if (name && brands[j].name.trim().toLowerCase() === name) return brands[j];
      return null;
    }
    finals.forEach(function (o) { var b = findBrand(o); if (b) { b.list = "final"; b.outreach = b.outreach === "Not contacted" ? "Ready to contact" : b.outreach; b.statusDate = dateStr(o["date added"]) || b.statusDate; } });
    outs.forEach(function (o) {
      var b = findBrand(o);
      if (!b) return;
      if (o.status) b.outreach = o.status;
      var d = dateStr(o["status date"]);
      if (d) { b.statusDate = d; b.list = "final"; }
      if (b.outreach === "Seen - replied") b.list = "engagement";
    });
    engs.forEach(function (o) { var b = findBrand(o); if (b) { b.list = "engagement"; b.outreach = "Seen - replied"; b.statusDate = dateStr(o["status date"]) || b.statusDate; } });
    waits.forEach(function (o) { var b = findBrand(o); if (b) { b.list = "waiting"; b.outreach = "Asked for time"; b.statusDate = dateStr(o["status date"]) || b.statusDate; } });
    custs.forEach(function (o) { var b = findBrand(o); if (b) { b.list = "customers"; b.outreach = "Ordered"; b.orderDate = dateStr(o["order date"]) || b.statusDate; b.statusDate = dateStr(o["order date"]) || b.statusDate; } });
    susps.forEach(function (o) { var b = findBrand(o); if (b) { b.list = "suspended"; b.outreach = "Suspended"; b.statusDate = dateStr(o["suspended date"]) || b.statusDate; } });
    archs.forEach(function (o) {
      var b = findBrand(o);
      if (b) {
        b.list = "archive";
        b.archiveReason = o.reason || "Rejected by me";
        b.archiveDetail = o["detail (failing criterion / note)"] || o.detail || "";
        b.statusDate = dateStr(o["removal date"]) || b.statusDate;
      }
    });

    /* search log */
    var logSheet = byName["search log"];
    var logRowsOut = logSheet ? sheetToObjects(logSheet).map(function (o) {
      return {
        date: dateStr(o.date), country: o["country / region"] || "", niche: o.niche || "",
        query: o["search query / keyword"] || "", platform: o["platform / source"] || "",
        reviewed: Number(o["profiles reviewed"]) || 0, potential: Number(o["potential leads found"]) || 0,
        qualified: Number(o["qualified leads"]) || 0, minutes: Number(o["time spent (min)"]) || 0,
        notes: o["notes / what worked"] || ""
      };
    }).filter(function (e) { return e.query || e.qualified; }) : [];

    return { brands: brands, skipped: skipped, searchLog: logRowsOut };
  }

  function dateStr(v) {
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return fromSerial(v);
    var s = String(v).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
    var m = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);   /* d/m/yyyy */
    if (m) return m[3] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2);
    var m2 = s.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/);
    if (m2) return m2[1] + "-" + ("0" + m2[2]).slice(-2) + "-" + ("0" + m2[3]).slice(-2);
    var d = new Date(s);
    if (!isNaN(d.getTime())) return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
    return null;
  }

  var API = { build: build, read: read, buildWorkbook: buildWorkbook, readWorkbook: readWorkbook,
    zip: zip, unzip: unzip, toSerial: toSerial, fromSerial: fromSerial, colName: colName,
    sheetToObjects: sheetToObjects, dateStr: dateStr };

  root.Xlsx = API;
  if (typeof module !== "undefined" && module.exports) module.exports = API;
})(typeof window !== "undefined" ? window : globalThis);

</script>

<!-- ======================= db.js — IndexedDB / localStorage / memory storage ======================= -->
<script>
/* =====================================================================
   Frasha Lead Finder — db.js
   Data persistence with three honest levels:
     1. IndexedDB   (normal when the file is opened/served for real)
     2. localStorage (fallback)
     3. memory only  (sandboxed preview iframe blocks both — data is then
                      session-only and the app SAYS SO on screen)
   Every call is wrapped in try/catch: nothing here can crash the app.
   ===================================================================== */
(function (root) {
  "use strict";

  var DB_NAME = "frasha-lead-finder";
  var STORE = "kv";
  var KEY = "state";
  var mode = "memory";
  var mem = null;
  var dbp = null;

  function openIDB() {
    return new Promise(function (resolve, reject) {
      if (typeof indexedDB === "undefined" || !indexedDB) return reject(new Error("no-idb"));
      var req;
      try { req = indexedDB.open(DB_NAME, 1); } catch (e) { return reject(e); }
      var timer = setTimeout(function () { reject(new Error("idb-timeout")); }, 2500);
      req.onupgradeneeded = function () {
        try { req.result.createObjectStore(STORE); } catch (e) { /* exists */ }
      };
      req.onsuccess = function () { clearTimeout(timer); resolve(req.result); };
      req.onerror = function () { clearTimeout(timer); reject(req.error || new Error("idb-error")); };
      req.onblocked = function () { clearTimeout(timer); reject(new Error("idb-blocked")); };
    });
  }

  function idbGet(db) {
    return new Promise(function (resolve, reject) {
      try {
        var tx = db.transaction(STORE, "readonly");
        var r = tx.objectStore(STORE).get(KEY);
        r.onsuccess = function () { resolve(r.result || null); };
        r.onerror = function () { reject(r.error); };
      } catch (e) { reject(e); }
    });
  }

  function idbPut(db, val) {
    return new Promise(function (resolve, reject) {
      try {
        var tx = db.transaction(STORE, "readwrite");
        tx.objectStore(STORE).put(val, KEY);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error || new Error("aborted")); };
      } catch (e) { reject(e); }
    });
  }

  function lsAvailable() {
    try {
      var k = "__frasha_test__";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return true;
    } catch (e) { return false; }
  }

  /** open storage; resolves with the detected mode */
  function open() {
    return openIDB().then(function (db) {
      return idbGet(db).then(function (val) {
        mode = "idb"; dbp = db;
        mem = val;
        return mode;
      });
    }).catch(function () {
      if (lsAvailable()) {
        mode = "ls";
        try { mem = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { mem = null; }
        return mode;
      }
      mode = "memory";
      return mode;
    });
  }

  function read() { return mem || null; }

  var pending = null, saving = false;

  function saveLater(value) {
    mem = value;
    if (pending) clearTimeout(pending);
    pending = setTimeout(function () { pending = null; save(value); }, 350);
    return Promise.resolve(mode);
  }

  function save(value) {
    mem = value;
    if (mode === "idb" && dbp) return idbPut(dbp, value).catch(function () { return false; });
    if (mode === "ls") {
      try { localStorage.setItem(KEY, JSON.stringify(value)); return Promise.resolve(true); }
      catch (e) { return Promise.resolve(false); }
    }
    return Promise.resolve(false);   /* memory only */
  }

  function clear() {
    mem = null;
    if (mode === "idb" && dbp) {
      return new Promise(function (resolve) {
        try {
          var tx = dbp.transaction(STORE, "readwrite");
          tx.objectStore(STORE).delete(KEY);
          tx.oncomplete = function () { resolve(true); };
          tx.onerror = function () { resolve(false); };
        } catch (e) { resolve(false); }
      });
    }
    if (mode === "ls") { try { localStorage.removeItem(KEY); } catch (e) { } }
    return Promise.resolve(true);
  }

  function modeLabel() { return mode; }

  root.Db = { open: open, read: read, save: save, saveLater: saveLater, clear: clear, mode: modeLabel };
})(typeof window !== "undefined" ? window : globalThis);

</script>

<!-- ======================= ui.js — Screens and interactions ======================= -->
<script>
/* =====================================================================
   Frasha Lead Finder — ui.js
   All screens and interactions. No frameworks: HTML strings + event
   delegation, so the file stays easy for any model to edit later.
   ===================================================================== */
(function (root) {
  "use strict";

  var L = root.Logic, T = root.I18n, X = root.Xlsx, Db = root.Db;
  var APP_VERSION = "2.0.0-phase2";

  var App = {
    settings: JSON.parse(JSON.stringify(L.DEFAULT_SETTINGS)),
    brands: [], notifs: [], searchLog: [],
    ui: { tab: "home", pipe: "outreach", reviewId: null, sheet: null, sheetData: null,
      filter: "all", ob: 0, shareQueue: [] },
    undo: [], ready: false, storage: "memory", lastSaved: null, busy: false
  };

  /* ------------------------------------------------------------ utilities */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function t(k, v) { return T.t(k, v); }
  function n(v) { return T.num(v); }
  function fi(v) { return T.fmtInt(v); }
  function today() { return L.todayISO(); }
  function $(sel) { return document.querySelector(sel); }
  function brand(id) { for (var i = 0; i < App.brands.length; i++) if (App.brands[i].id === id) return App.brands[i]; return null; }
  function byList(list) {
    return App.brands.filter(function (b) { return b.list === list; });
  }
  function nameOf(b) { return b.name || b.handle || "—"; }
  function priorityPill(b) {
    var p = L.priorityOf(b);
    var cls = p.tier === "High" ? "high" : p.tier === "Medium" ? "medium" : p.tier === "Low" ? "low" : "review";
    var label = p.tier === "none" ? t("not_qualified") : p.tier === "review" ? t("review_priority")
      : p.tier === "High" ? t("hi_priority") : p.tier === "Medium" ? t("med_priority") : t("low_priority");
    return '<span class="pill ' + cls + '">' + esc(label) + (p.score ? " · " + n(p.score) : "") + "</span>";
  }
  function statusLabel(st) {
    var map = {
      "Not contacted": "s_not_contacted", "Ready to contact": "s_ready", "Message sent": "s_sent",
      "Seen - no reply": "s_seen_no_reply", "Seen - replied": "s_seen_replied", "Asked for time": "s_asked_time",
      "Ordered": "s_ordered", "Not agreed": "s_not_agreed", "Expired (no response)": "s_expired",
      "Suspended": "s_suspended", "Not a fit": "s_not_fit"
    };
    return t(map[st] || "s_not_contacted");
  }
  function reasonLabel(r) {
    var map = { "Rejected by me": "r_rejected", "Auto-rejected": "r_auto", "Not agreed": "r_not_agreed",
      "Deal cancelled": "r_cancelled", "Expired (no response)": "r_expired",
      "Seen - no reply": "r_seen_no_reply", "Suspended": "r_suspended" };
    return t(map[r] || "r_rejected");
  }
  function listLabel(list) {
    return ({ final: t("pipe_outreach"), engagement: t("pipe_engagement"), waiting: t("pipe_waiting"),
      customers: t("pipe_customers"), suspended: t("pipe_suspended"), archive: t("pipe_archive"),
      pool: t("home_pool") })[list] || list;
  }
  function initials(name) {
    var s = String(name || "?").trim();
    return s.slice(0, 1).toUpperCase();
  }
  function timerBadge(b) {
    var info = L.timerInfo(b, App.settings, today());
    if (!info) return "";
    if (info.kind === "engagement") return '<span class="pill">' + esc(t("pipe_day_x_of_y", { x: n(info.day), y: "∞" })) + "</span>";
    var cls = info.state === "expired" ? "fail" : info.state === "due" ? "review" : "teal";
    var label = t("pipe_day_x_of_y", { x: n(info.day), y: n(info.total) });
    return '<span class="pill ' + cls + '">' + esc(label) + "</span>";
  }

  /* ------------------------------------------------------------- storage */
  var saveTimer = null;
  function save() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      Db.save({
        version: APP_VERSION, savedAt: new Date().toISOString(),
        settings: App.settings, brands: App.brands, notifs: App.notifs.slice(0, 300),
        searchLog: App.searchLog
      }).then(function () { App.lastSaved = new Date(); });
    }, 300);
  }

  /* --------------------------------------------------------- transitions */
  function pushUndo(entry) {
    App.undo.push(entry);
    if (App.undo.length > 30) App.undo.shift();
  }
  function toast(msg, actionLabel, action) {
    App.ui.toast = { msg: msg, label: actionLabel || null, action: action || null };
    renderToast();
    if (App.ui.toastTimer) clearTimeout(App.ui.toastTimer);
    App.ui.toastTimer = setTimeout(function () { App.ui.toast = null; renderToast(); }, action ? 6500 : 3200);
  }
  function renderToast() {
    var box = $("#toast");
    if (!box) return;
    var tt = App.ui.toast;
    if (!tt) { box.innerHTML = ""; return; }
    box.innerHTML = '<div class="toast"><span>' + esc(tt.msg) + "</span>" +
      (tt.label ? '<button data-act="toast-action">' + esc(tt.label) + "</button>" : "") + "</div>";
  }
  function notifyEvent(ev) {
    if (!ev) return;
    var key = ev.type === "moved" ? (ev.reply ? "reply" : "moved")
      : ev.type === "suspended" ? "suspended" : ev.type === "timer" ? "timer"
      : ev.type === "slot" ? "slot" : ev.type === "tier" ? "tier" : "data";
    if (App.settings.notif && App.settings.notif[key] === false) return;
    var text;
    if (ev.type === "moved") {
      text = t("n_moved") + ": " + nameOf(brand(ev.brandId) || ev) + " → " + listLabel(ev.list);
    } else if (ev.type === "timer") {
      text = t("n_timer") + ": " + nameOf(brand(ev.brandId) || ev);
    } else if (ev.type === "suspended") {
      text = t("n_suspended") + ": " + nameOf(brand(ev.brandId) || ev);
    } else if (ev.type === "slot") {
      text = t("n_slot") + ": " + nameOf(brand(ev.brandId) || ev);
    } else if (ev.type === "tier") {
      text = t("n_tier");
    } else {
      text = (ev.text || t("n_data"));
    }
    App.notifs.unshift({ id: L.uid("n"), type: key, text: text, ts: new Date().toISOString(), read: false });
    App.notifs = App.notifs.slice(0, 300);
  }
  function applyResult(res, undoLabel) {
    if (!res || !res.brand) return;
    var idx = -1;
    for (var i = 0; i < App.brands.length; i++) if (App.brands[i].id === res.brand.id) { idx = i; break; }
    var prev = idx >= 0 ? App.brands[idx] : null;
    if (idx >= 0) App.brands[idx] = res.brand; else App.brands.push(res.brand);
    pushUndo({ brandId: res.brand.id, prev: prev, label: undoLabel || t("undo"), notifs: App.notifs.length });
    if (res.event) notifyEvent(res.event);
    if (res.reply) notifyEvent({ type: "moved", brandId: res.brand.id, name: res.brand.name, list: res.brand.list, reply: true });
    if (res.slotFreed) notifyEvent({ type: "slot", brandId: res.brand.id, name: res.brand.name });
    afterChange();
  }
  function afterChange() {
    autoFill();
    save();
  }
  function autoFill() {
    var r = L.autoFillFinal(App.brands, App.settings, today());
    App.brands = r.brands;
    r.events.forEach(notifyEvent);
    if (r.filled) toast(t("home_open_slots") + ": " + n(r.filled) + " → " + t("final_title"));
  }
  function undoLast() {
    var u = App.undo.pop();
    if (!u) return;
    var idx = -1;
    for (var i = 0; i < App.brands.length; i++) if (App.brands[i].id === u.brandId) { idx = i; break; }
    if (idx >= 0) {
      if (u.prev) App.brands[idx] = u.prev; else App.brands.splice(idx, 1);
    } else if (u.prev) App.brands.push(u.prev);
    App.notifs = App.notifs.slice(0, u.notifs || App.notifs.length);
    save();
    toast(t("restored"));
    render();
  }
  function patchBrand(id, patch) {
    var b = brand(id);
    if (!b) return null;
    var copy = L.clone(b);
    Object.keys(patch).forEach(function (k) { copy[k] = patch[k]; });
    copy.updatedAt = new Date().toISOString();
    var idx = App.brands.indexOf(b);
    App.brands[idx] = copy;
    save();
    return copy;
  }

  /* ------------------------------------------------------- maintenance */
  function maintenance(silent) {
    var before = App.brands.length;
    var ar = L.runAutoReject(App.brands, App.settings, today());
    App.brands = ar.brands;
    if (ar.rejected && !silent) {
      toast(t("r_auto") + ": " + n(ar.rejected), t("undo"), function () { undoLast(); });
    }
    var sc = L.runStatusCheck(App.brands, App.settings, today(), { notice: true });
    App.brands = sc.brands;
    sc.events.forEach(notifyEvent);
    autoFill();
    return { rejected: ar.rejected, changed: sc.changed.length };
  }

  /* ---------------------------------------------------------- navigation */
  function go(tab) {
    App.ui.tab = tab;
    App.ui.sheet = null;
    render();
    try { window.scrollTo({ top: 0, behavior: "instant" }); } catch (e) { }
  }

  /* ==================================================================== */
  /*  RENDER                                                              */
  /* ==================================================================== */
  /** re-render the three live regions; the overlay and toast are separate
      so an open sheet keeps its inputs (and never loses focus) */
  function render() {
    document.documentElement.lang = T.getLang();
    document.documentElement.dir = T.isRTL() ? "rtl" : "ltr";
    var top = document.getElementById("topbar");
    var content = document.getElementById("content");
    var navEl = document.getElementById("nav");
    if (top) top.innerHTML = topbar();
    if (content) content.innerHTML = screen();
    if (navEl) navEl.innerHTML = nav();
  }

  function unread() {
    return App.notifs.filter(function (x) { return !x.read; }).length;
  }

  function topbar() {
    var u = unread();
    return '<header class="topbar">' +
      '<div class="brand"><b>' + esc(t("app")) + "</b><span>" + esc(t("tagline")) + "</span></div>" +
      '<button class="icon-btn" data-act="sheet-notifs" aria-label="notifications">🔔' +
      (u ? '<span class="badge">' + n(u > 9 ? "9+" : u) + "</span>" : "") + "</button>" +
      '<button class="icon-btn" data-act="sheet-settings" aria-label="settings">⚙️</button>' +
      "</header>";
  }

  function nav() {
    var tabs = [["home", "🏠", "nav_home"], ["review", "✅", "nav_review"],
      ["final", "🎯", "nav_final"], ["pipeline", "🔀", "nav_pipeline"]];
    return '<nav class="nav">' + tabs.map(function (x) {
      return '<button data-act="tab" data-tab="' + x[0] + '" class="' + (App.ui.tab === x[0] ? "on" : "") + '">' +
        '<span class="ico">' + x[1] + "</span><span>" + esc(t(x[2])) + "</span></button>";
    }).join("") + "</nav>";
  }

  function screen() {
    if (!App.ready) return '<div class="loading-row"><span class="spin"></span>' + esc(t("loading")) + "</div>";
    if (App.ui.tab === "home") return screenHome();
    if (App.ui.tab === "review") return screenReview();
    if (App.ui.tab === "final") return screenFinal();
    return screenPipeline();
  }

  /* ------------------------------------------------------------- home */
  function ring(pct, label) {
    var r = 52, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(1, pct)));
    return '<div class="ring"><svg width="132" height="132">' +
      '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="11"/>' +
      '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="url(#g1)" stroke-width="11" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      '<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#12988B"/><stop offset="1" stop-color="#2FD3C0"/></linearGradient></defs></svg>' +
      '<div class="ring-num" dir="ltr"><b>' + esc(label) + "</b></div></div>";
  }

  function screenHome() {
    var target = Number(App.settings.target) || 100;
    var finals = byList("final").length;
    var pool = byList("pool");
    var tiers = L.tierCounts(App.brands);
    var qualified = pool.filter(function (b) { return L.criteria(b, App.settings, today()).result === "YES"; }).length;
    var review = pool.filter(function (b) { return L.criteria(b, App.settings, today()).result === "REVIEW"; }).length;
    var open = Math.max(0, target - finals);
    var todayList = dueToday();

    var html = "";
    if (App.storage === "memory") {
      html += '<div class="warn" style="margin-bottom:12px">⚠️ ' + esc(t("set_mem_warning")) + "</div>";
    }
    html += '<section class="card" style="text-align:center">' +
      '<div style="display:flex;justify-content:center">' +
      ring(finals / target, n(finals) + " / " + n(target)) + "</div>" +
      '<div class="small muted" style="margin-top:6px">' + esc(t("home_progress")) + "</div>" +
      '<div class="row between" style="margin-top:14px">' +
      miniStat(t("home_pool"), n(pool.length)) +
      miniStat(t("home_qualified"), n(qualified)) +
      miniStat(t("home_review_needed"), n(review)) +
      "</div>" +

  function dueToday() {
    var out = [];
    App.brands.forEach(function (b) {
      var info = L.timerInfo(b, App.settings, today());
      if (!info) return;
      if (info.state === "due" || info.state === "expired") out.push(b);
    });
    out.sort(function (a, b) {
      var ia = L.timerInfo(a, App.settings, today()), ib = L.timerInfo(b, App.settings, today());
      return (ib.daysLeft === null ? -1 : ib.daysLeft) - (ia.daysLeft === null ? -1 : ia.daysLeft);
    });
    return out.slice(0, 6);
  }

  function queue() { return L.poolBrands(App.brands); }

    var html = '<div class="row between" style="margin-bottom:10px">' +
      '<div class="small dim">' + esc(t("review_queue_pos")) + " " + n(pos + 1) + " " + esc(t("review_of_word")) + " " + n(q.length) + "</div>" +
      '<div class="chips">' + priorityPill(current) +

    html += '<section class="card" data-review="' + current.id + '">' +
      '<div class="row between">' +
      '<div class="grow"><h1 style="font-size:19px">' + esc(nameOf(current)) + "</h1>" +
      '<div class="small muted">' + esc([current.country, current.niche].filter(Boolean).join(" · ") || "—") + "</div></div>" +
      '<span class="ava" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(47,211,192,.12);color:var(--teal);font-weight:800">' +
      esc(initials(nameOf(current))) + "</span></div>" +

  function lightsHTML(c) {
    var items = [["followers", "c_followers", c.followers.state], ["recent", "c_recent", c.recent.state],
      ["fit", "c_fit", c.fit.state], ["contact", "c_contact", c.contact.state]];
    return '<div class="lights">' + items.map(function (it) {
      var cls = it[2] === "pass" ? "pass" : it[2] === "fail" ? "fail" : (it[2] === "unknown" ? "" : "review");
      return '<div class="light ' + cls + '"><div class="dot"></div><div class="lbl">' + esc(t(it[1])) + "</div></div>";
    }).join("") + "</div>";
  }

  function missingLabels(c) {
    var out = [];
    if (c.followers.state !== "pass") out.push(t("c_followers"));
    if (c.recent.state !== "pass") out.push(t("c_recent"));
    if (c.fit.state !== "pass") out.push(t("c_fit"));
    if (c.contact.state !== "pass") out.push(t("c_contact"));
    return out.join(" · ");

  /* ------------------------------------------------------------ final */
  function screenFinal() {
    var list = byList("final").sort(function (a, b) {
      var pa = L.priorityOf(a).score || 0, pb = L.priorityOf(b).score || 0;
      if (pb !== pa) return pb - pa;
      return String(a.name).localeCompare(String(b.name));
    });
    var open = Math.max(0, (Number(App.settings.target) || 100) - list.length);
    var f = App.ui.filter;
    var shown = list.filter(function (b) {
      if (f === "all") return true;
      if (f === "waiting") return b.outreach === "Message sent";
      return L.priorityOf(b).tier === f;
    });

    var h = '<section class="card flat"><div class="row between">' +
      "<b>" + esc(t("final_title")) + "</b>" +
      '<div class="chips"><span class="pill teal">' + n(list.length) + " " + esc(t("final_count")) + "</span>" +
      (open ? '<span class="pill review">' + n(open) + " " + esc(t("final_open_slots")) + "</span>" : "") +
      "</div></div></section>";

    h += '<div class="seg teal" style="margin:12px 0">' +
      [["all", t("all")], ["High", t("hi_priority")], ["Medium", t("med_priority")], ["Low", t("low_priority")], ["waiting", t("s_sent")]]
        .map(function (x) {
          return '<button data-act="filter" data-val="' + x[0] + '" class="' + (f === x[0] ? "on" : "") + '">' + esc(x[1]) + "</button>";
        }).join("") + "</div>";

    if (!shown.length) return h + emptyState("🎯", t("final_empty"), null, null);

    h += '<section class="list">' + shown.map(function (b) {
      var timer = L.timerInfo(b, App.settings, today());
      var badge = b.outreach === "Message sent" && timer
        ? '<span class="pill ' + (timer.state === "expired" ? "fail" : timer.state === "due" ? "review" : "teal") + '">' +
          esc(t("pipe_day_x_of_y", { x: n(timer.day), y: n(timer.total) })) + "</span>"
        : '<span class="pill">' + esc(statusLabel(b.outreach)) + "</span>";
      return '<button class="item" data-act="open-brand" data-id="' + b.id + '">' +
        '<span class="ava">' + esc(initials(nameOf(b))) + "</span>" +
        '<span class="t"><b>' + esc(nameOf(b)) + "</b><span>" + esc([b.country, b.niche].filter(Boolean).join(" · ")) + "</span></span>" +
        '<span class="end">' + priorityPill(b) + badge + "</span></button>";
    }).join("") + "</section>";
    return h;
  }

  /* --------------------------------------------------------- pipeline */
  function screenPipeline() {
    var tabs = [["outreach", t("pipe_outreach"), ["final", "engagement"]],
      ["engagement", t("pipe_engagement"), ["engagement"]],
      ["waiting", t("pipe_waiting"), ["waiting"]],
      ["customers", t("pipe_customers"), ["customers"]],
      ["suspended", t("pipe_suspended"), ["suspended"]],
      ["archive", t("pipe_archive"), ["archive"]]];
    var cur = tabs.find(function (x) { return x[0] === App.ui.pipe; }) || tabs[0];
    var items = App.brands.filter(function (b) { return cur[2].indexOf(b.list) >= 0; });

    var h = '<div class="seg" style="margin-bottom:12px;flex-wrap:nowrap">' + tabs.map(function (x) {
      var count = App.brands.filter(function (b) { return x[2].indexOf(b.list) >= 0; }).length;
      return '<button data-act="pipe" data-val="' + x[0] + '" class="' + (App.ui.pipe === x[0] ? "on" : "") + '">' +
        esc(x[1]) + (count ? " " + n(count) : "") + "</button>";
    }).join("") + "</div>";

    if (!items.length) return h + emptyState("🗂️", t("pipe_empty"), null, null);

    h += '<section class="list">' + items.slice(0, 60).map(function (b) {
      var info = L.timerInfo(b, App.settings, today());
      var chip = "";
      if (info) {
        if (info.kind === "engagement") chip = '<span class="pill teal">' + esc(t("pipe_day_x_of_y", { x: n(info.day), y: "∞" })) + "</span>";
        else chip = '<span class="pill ' + (info.state === "expired" ? "fail" : info.state === "due" ? "review" : "teal") + '">' +
          esc(t("pipe_day_x_of_y", { x: n(info.day), y: n(info.total) })) + "</span>";
      }
      var sub = b.list === "archive" ? reasonLabel(b.archiveReason) : statusLabel(b.outreach);
      return '<button class="item" data-act="open-brand" data-id="' + b.id + '">' +
        '<span class="ava">' + esc(initials(nameOf(b))) + "</span>" +
        '<span class="t"><b>' + esc(nameOf(b)) + "</b><span>" + esc(sub) + "</span></span>" +
        '<span class="end">' + chip + "</span></button>";
    }).join("") + "</section>";
    if (items.length > 60) h += '<div class="tiny dim center" style="margin-top:10px">+' + n(items.length - 60) + "</div>";
    return h;
  }

  function openSheet(type, data) {
    App.ui.sheet = { type: type, data: data || null };
    renderSheet();
  }
  function closeSheet() {
    App.ui.sheet = null;
    renderSheet();
  }
  function renderSheet() {
    var box = $("#overlay");
    if (!box) return;
    var s = App.ui.sheet;
    if (!s) { box.innerHTML = ""; return; }
    var body = "";
    var title = "";
    if (s.type === "settings") { title = t("set_title"); body = sheetSettings(); }
    else if (s.type === "notifs") { title = t("notif_title"); body = sheetNotifs(); }
    else if (s.type === "brand") { var b = brand(s.data); title = b ? nameOf(b) : ""; body = sheetBrand(b); }
    else if (s.type === "wizard") { title = t("add_title"); body = sheetWizard(); }
    else if (s.type === "import") { title = t("imp_title"); body = sheetImport(); }
    else if (s.type === "export") { title = t("exp_title"); body = sheetExport(); }
    else if (s.type === "prompt") { title = t("pb_title"); body = sheetPrompt(); }
    else if (s.type === "pack") { title = t("sp_title"); body = sheetPack(); }
    else if (s.type === "log") { title = t("set_pack") + " · log"; body = sheetSearchLog(); }
    else if (s.type === "share") { title = t("share_title"); body = sheetShare(); }

    box.innerHTML = '<div class="sheet-wrap" data-act="sheet-backdrop"><div class="sheet">' +
      '<div class="handle"></div><div class="sheet-head"><h2>' + esc(title) + "</h2>" +
      '<button class="icon-btn" data-act="sheet-close">✕</button></div>' + body + "</div></div>";
    /* clicks inside the sheet bubble to the document handler on purpose:
       the backdrop only closes when the click target IS the backdrop */
  }

  function timeAgo(iso) {

    return Math.round(diff / 1440) + "d";
  }

  function refreshReview() {
    var b = brand(App.ui.reviewId);

    var c = L.criteria(b, App.settings, today());
    var card = document.querySelector("[data-review]");
    if (!card) { render(); return; }
    var lights = card.querySelector(".lights");
    if (lights) lights.outerHTML = lightsHTML(c);
    var approveBtn = document.querySelector('[data-act="approve"]');

      else approveBtn.setAttribute("disabled", "");
    }

      var age = b.lastPostDate ? L.daysBetween(b.lastPostDate, today()) : null;
      ageEl.textContent = age === null ? "—" : n(age);
    }
    var dateEl = card.querySelector('[data-live="age-date"]');

    var b = brand(App.ui.reviewId);

    var age = b.lastPostDate ? L.daysBetween(b.lastPostDate, today()) : null;

  async function smartPaste() {
    var text = "";
    try {
      text = await navigator.clipboard.readText();
    } catch (err) {
      try {
        text = await new Promise(function (res, rej) {
          var ta = document.createElement("textarea");
          ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.focus();
          if (document.execCommand("copy")) { res(ta.value); } else { rej(new Error("no")); }
          ta.remove();
        });
      } catch (e2) {
        toast(t("cant_read_clipboard"));
        return;
      }
    }
    if (!text) { toast(t("review_paste_nothing")); return; }
    var parsed = L.classifyPaste(text);
    applyPasteToReview(parsed);

  function shrinkImage(file) {
    return new Promise(function (resolve) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var maxW = 760;
          var scale = Math.min(1, maxW / img.width);
          var cv = document.createElement("canvas");
          cv.width = Math.round(img.width * scale);
          cv.height = Math.round(img.height * scale);
          cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
          try { resolve(cv.toDataURL("image/jpeg", 0.72)); } catch (e) { resolve(""); }
        };
        img.onerror = function () { resolve(""); };
        img.src = reader.result;
      };
      reader.onerror = function () { resolve(""); };
      reader.readAsDataURL(file);
    });
  }
